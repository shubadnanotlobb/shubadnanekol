<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar"><div class="appbar-inner shell"><div class="appbar-title">المطعم</div><div class="appbar-spacer"></div></div></header>
<main class="main shell"><p>preview</p></main>

<!-- lightbox (visible) -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="إغلاق">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="السابق">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <img class="lightbox-img" id="lightboxImg" src="iconnn.jpeg" alt="صورة المعرض">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="التالي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <div class="lightbox-count" id="lightboxCount">2 / 6</div>
</div>
</body>
</html>
